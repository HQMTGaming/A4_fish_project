# Convergence study, method: rk4. Same problem as scenarios/baseline.yaml.
# There is no closed form for H = 100, so the order is measured against a
# reference run (mode: self). Horizon is [0, 10] years: the stock is still
# moving, so the error is visible. At t = 50 it has relaxed to N+ and every
# method has nearly zero error, which hides the order.
# NOTE: key names are a first guess. Compare with de_kit/scenario_template.yaml.

name: a4_conv_rk4
system: A4_fish
module: A4_fish.py
method: rk4
dt: 0.0625
t_span: [0.0, 10.0]

params:
  policy: quota
  r: 0.5
  K: 1000.0
  H: 100.0

initial:
  N: 800.0

checks:
  - type: convergence_order
    mode: self
    dt_list: [1.0, 0.5, 0.25, 0.125, 0.0625]
    expected_order: 4
    tol: 0.3
  - type: within_bounds
    variable: N
    min: 0.0
    tol: 1.0e-8

ai_use: "Claude (Anthropic) was used to draft the module and this file. The group read, ran and tested everything."
consent_physeval: false
