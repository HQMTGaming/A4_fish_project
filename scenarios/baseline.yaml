# Baseline: constant quota H = 100 t/year, stock starts at 800 t.
# Expected: N goes to the stable equilibrium N+ = 723.6 t.
# NOTE: key names are a first guess. Compare with de_kit/scenario_template.yaml.

name: a4_baseline
system: A4_fish
module: A4_fish.py
method: rk4
dt: 0.1            # years
t_span: [0.0, 50.0]

params:
  policy: quota
  r: 0.5           # 1/year
  K: 1000.0        # tonnes
  H: 100.0         # tonnes/year

initial:
  N: 800.0         # tonnes

checks:
  - type: reference_match
    quantity: N_final
    reference: 723.6067977      # N+ = (K/2)(1 + sqrt(1 - 4H/(rK)))
    tol: 0.05                   # tonnes; the transient left at t = 50 is about 0.001
  - type: within_bounds
    variable: N
    min: 0.0
    tol: 1.0e-8
  - type: convergence_order
    mode: self
    t_span: [0.0, 10.0]
    dt_list: [1.0, 0.5, 0.25, 0.125, 0.0625]
    expected_order: 4
    tol: 0.3

ai_use: "Claude (Anthropic) was used to draft the module and this file. The group read, ran and tested everything."
consent_physeval: false
